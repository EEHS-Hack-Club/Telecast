# Paste this into https://api.slack.com/apps → Create New App → From a manifest.
# Replace the redirect URL with your own address, keeping /auth/callback on the end.
display_information:
  name: Telecast
  description: Sign-in for the event screens control panel
features:
  bot_user:
    display_name: Telecast
    always_online: false
oauth_config:
  redirect_urls:
    - https://telecast.haven.london/auth/callback
  scopes:
    # Lets Telecast see which private channels the bot is in, and who their members are.
    bot:
      - groups:read
    # "Sign in with Slack": tells Telecast who is signing in, and nothing else.
    user:
      - openid
      - profile
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
